<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="fw-bold">Catálogo de Instrumentos y Audio</h2>
</div>

<div class="row g-3 mb-4 bg-light p-3 rounded border">
  <div class="col-md-7">
    <label class="form-label fw-semibold">Buscar instrumento o equipo:</label>
    <input
      type="text"
      class="form-control"
      placeholder="Ej. Guitarra, Piano, Consola..."
      [(ngModel)]="textoBusqueda">
  </div>
  <div class="col-md-5">
    <label class="form-label fw-semibold">Filtrar por categoría:</label>
    <select class="form-select" [(ngModel)]="categoriaSeleccionada">
      <option value="Todas">Todas las categorías</option>
      <option value="Cuerdas">Cuerdas</option>
      <option value="Teclados">Teclados</option>
      <option value="Percusión">Percusión</option>
      <option value="Audio">Audio</option>
      <option value="Vientos">Vientos</option>
    </select>
  </div>
</div>

@if (equiposFiltrados.length > 0) {
  <div class="row row-cols-1 row-cols-md-3 g-4">
    @for (item of equiposFiltrados; track item.id) {
      <div class="col">
        <app-tarjeta-equipo
          [equipo]="item"
          (seleccionarEquipo)="irARegistro($event)" />
      </div>
    }
  </div>
} @else {
  <div class="alert alert-warning text-center">
    No se encontraron equipos que coincidan con tu búsqueda.
  </div>
}
