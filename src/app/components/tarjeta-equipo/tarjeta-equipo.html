<div class="card h-100 shadow-sm border-0">
  <img [src]="equipo().imagen" [alt]="equipo().nombre" class="card-img-top" style="height: 180px; object-fit: cover;">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <span class="badge bg-secondary">{{ equipo().categoria }}</span>
      <span class="badge" [ngClass]="equipo().disponibles > 0 ? 'bg-success' : 'bg-danger'">
        {{ equipo().disponibles > 0 ? (equipo().disponibles + ' disponibles') : 'Agotado' }}
      </span>
    </div>

    <h5 class="card-title">{{ equipo().nombre | titlecase }}</h5>
    <p class="card-text text-muted mb-3">
      Tarifa: <strong class="text-dark">{{ equipo().precioDia | currency:'Bs. ':'symbol':'1.2-2' }}</strong> / día
    </p>

    <button
      class="btn btn-danger mt-auto w-100"
      [disabled]="equipo().disponibles === 0"
      (click)="onAlquilar()">
      {{ equipo().disponibles > 0 ? 'Alquilar equipo' : 'Sin stock' }}
    </button>
  </div>
</div>
